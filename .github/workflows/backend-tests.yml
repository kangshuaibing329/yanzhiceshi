name: Backend tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  frontend-static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract inline JavaScript
        run: |
          python -c "from pathlib import Path; import re; html=Path('index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, re.S); assert len(scripts)==1, f'Expected one inline script, got {len(scripts)}'; Path('/tmp/yanzhi-inline.js').write_text(scripts[0], encoding='utf-8')"
      - name: Check JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check /tmp/yanzhi-inline.js
